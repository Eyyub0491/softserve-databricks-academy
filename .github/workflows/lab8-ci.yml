name: lab8-local-checks

on:
  pull_request:
    paths:
      - ".github/workflows/lab8-ci.yml"
      - "week08/lab8_production_deployment/**"
      - "week07/lab7_testing_dq/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lab8-ci.yml"
      - "week08/lab8_production_deployment/**"
      - "week07/lab7_testing_dq/**"

jobs:
  lab8-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r week07/lab7_testing_dq/requirements.txt PyYAML

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Validate Lab 8 configuration and repository references
        run: |
          python - <<'PY'
          import ast
          import json
          import re
          from pathlib import Path

          import yaml

          root = Path("week08/lab8_production_deployment")
          resource_dir = root / "resources"

          for path in root.rglob("*.yml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          for path in root.rglob("*.yaml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          for path in root.rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))

          for path in root.rglob("*.ipynb"):
              notebook = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(notebook.get("cells"), list), path
              for cell in notebook["cells"]:
                  assert cell.get("cell_type") in {"code", "markdown", "raw"}, path
                  if cell.get("cell_type") == "code":
                      ast.parse("".join(cell.get("source", [])), filename=str(path))

          pipelines = yaml.safe_load((resource_dir / "pipelines.yml").read_text(encoding="utf-8"))
          schemas = yaml.safe_load((resource_dir / "schemas.yml").read_text(encoding="utf-8"))
          jobs = yaml.safe_load((resource_dir / "jobs.yml").read_text(encoding="utf-8"))

          pipeline_resources = pipelines["resources"]["pipelines"]
          schema_resources = schemas["resources"]["schemas"]
          orchestration = jobs["resources"]["jobs"]["lab8_production_orchestration"]

          assert set(schema_resources) == {"bronze_schema", "silver_schema", "gold_schema"}
          for schema in schema_resources.values():
              assert schema["catalog_name"] == "${var.catalog}"

          pipeline_text = (resource_dir / "pipelines.yml").read_text(encoding="utf-8")
          for path_value in re.findall(r"path:\s*(\S+)", pipeline_text):
              resolved_path = (resource_dir / path_value).resolve()
              assert resolved_path.exists(), f"Missing path: {path_value} -> {resolved_path}"

          gold_notebook = root / "src/gold/01_gold_star_schema.ipynb"
          assert gold_notebook.exists(), gold_notebook

          task_keys = [task["task_key"] for task in orchestration["tasks"]]
          assert task_keys[:4] == ["lab5_bronze", "lab5_silver", "lab7_data_quality", "gold_star_schema"]
          assert orchestration["tasks"][1]["depends_on"][0]["task_key"] == "lab5_bronze"
          assert orchestration["tasks"][2]["depends_on"][0]["task_key"] == "lab5_silver"
          assert orchestration["tasks"][3]["depends_on"][0]["task_key"] == "lab7_data_quality"

          job_text = (resource_dir / "jobs.yml").read_text(encoding="utf-8")
          for resource_name in re.findall(r"resources\.pipelines\.([^.]+)\.id", job_text):
              assert resource_name in pipeline_resources, resource_name

          gold_task = orchestration["tasks"][3]
          assert gold_task["notebook_task"]["notebook_path"] == "../src/gold/01_gold_star_schema.ipynb"
          assert set(gold_task["notebook_task"]["base_parameters"]) == {
              "catalog",
              "bronze_schema",
              "silver_schema",
              "gold_schema",
          }

          print("Lab 8 local/static checks passed")
          PY

      - name: Run Lab 7 tests
        run: |
          python -m pytest week07/lab7_testing_dq/tests/unit -q

  lab8-prod-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lab8-ci
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_PROD_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PROD_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r week07/lab7_testing_dq/requirements.txt PyYAML

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Run Lab 7 tests
        run: |
          python -m pytest week07/lab7_testing_dq/tests/unit -q

      - name: Validate Databricks bundle for prod target
        working-directory: week08/lab8_production_deployment
        run: |
          databricks bundle validate --target prod

      - name: Create PROD volumes if needed
        working-directory: week08/lab8_production_deployment
        run: |
          # Idempotent volume creation — CREATE VOLUME IF NOT EXISTS
          # never recreates or overwrites existing volumes.
          # Uses the Databricks SQL Statement Execution API via Python stdlib.
          python - <<'PY'
          import json, os, urllib.request

          host = os.environ["DATABRICKS_HOST"]
          token = os.environ["DATABRICKS_TOKEN"]
          warehouse_id = "3ed106620db591d9"

          catalog = "dbr_dev"
          schema = "ayyuborujzade_bronze"

          for volume in ["customer_landing", "checkpoints"]:
              sql = f"CREATE VOLUME IF NOT EXISTS {catalog}.{schema}.{volume}"
              print(f"Executing: {sql}")
              body = json.dumps({
                  "statement": sql,
                  "warehouse_id": warehouse_id,
                  "wait_timeout": "30s"
              }).encode()
              req = urllib.request.Request(
                  f"{host}/api/2.0/sql/statements",
                  data=body,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json"
                  }
              )
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  state = result.get("status", {}).get("state", "unknown")
                  print(f"  Status: {state}")
          PY

      - name: Bind existing Academy resources to bundle
        working-directory: week08/lab8_production_deployment
        run: |
          # The prod UC schemas (dbr_dev.ayyuborujzade_bronze/silver/gold) were
          # created in earlier labs and already contain data.  Without explicit
          # deployment bindings DABs treats them as unmanaged and tries to
          # recreate them — a destructive action that cannot be approved from a
          # non-interactive CI/CD runner.  Binding tells DABs these existing
          # resources belong to the bundle so it updates them in-place instead.
          #
          # The bind command returns a non-zero exit code with the message
          # "Resource already managed" when the resource is already bound to
          # the requested ID.  We treat that as success so the step is
          # idempotent across CI runs.  All other errors fail the workflow.
          bind_resource() {
            local key="$1" rid="$2" output
            if output=$(databricks bundle deployment bind "$key" "$rid" --target prod --auto-approve 2>&1); then
              echo "$output"
            else
              if echo "$output" | grep -q "Resource already managed"; then
                echo "$key already bound to $rid — skipping"
              else
                echo "$output" >&2
                return 1
              fi
            fi
          }

          # One-time cleanup: remove stale bundle-state association left by the
          # failed lab5_bronze_pipeline deployment.  Unbinding does NOT delete
          # the physical pipeline — it only removes the bundle tracking entry.
          #
          # `databricks bundle deployment unbind` requires the KEY to be defined
          # in the current bundle configuration.  Since lab5_bronze_pipeline was
          # renamed to lab5_lakeflow_pipeline, we create a temporary resource
          # file so the CLI accepts the key, run unbind, then remove it before
          # the deploy step.  The || true makes this idempotent across CI runs.
          cat > resources/_temp_unbind.yml << 'CLEANUP_EOF'
resources:
  pipelines:
    lab5_bronze_pipeline:
      name: lab5_bronze_pipeline
      catalog: ${var.catalog}
      target: ${var.bronze_schema}
      serverless: true
CLEANUP_EOF

          databricks bundle deployment unbind lab5_bronze_pipeline --target prod 2>&1 || true

          rm -f resources/_temp_unbind.yml

          bind_resource bronze_schema dbr_dev.ayyuborujzade_bronze
          bind_resource silver_schema dbr_dev.ayyuborujzade_silver
          bind_resource gold_schema dbr_dev.ayyuborujzade_gold

          # Bind the existing PROD Lab 5 pipeline to the restored resource key.
          bind_resource lab5_lakeflow_pipeline a491b7fb-1a3d-4a66-a33a-6b0105160ecf

          # The lab5_silver_pipeline is a new resource — no binding needed.
          # The bundle deploy will create it on first run.

          bind_resource lab7_pipeline 5965cbce-cee7-4b84-a059-0815db909237

      - name: Deploy Databricks bundle to prod target
        working-directory: week08/lab8_production_deployment
        run: |
          databricks bundle deploy --target prod
