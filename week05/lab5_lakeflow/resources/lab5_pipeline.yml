resources:
  schemas:
    bronze_schema:
      name: ayyuborujzade_bronze
      catalog_name: dbr_dev

    silver_schema:
      name: ayyuborujzade_silver
      catalog_name: dbr_dev

  volumes:
    customer_landing:
      name: customer_landing
      catalog_name: dbr_dev
      schema_name: ayyuborujzade_bronze
      volume_type: MANAGED

    checkpoints:
      name: checkpoints
      catalog_name: dbr_dev
      schema_name: ayyuborujzade_bronze
      volume_type: MANAGED

  pipelines:
    lab5_lakeflow:
      name: ayyuborujzade_lab5_lakeflow

      catalog: dbr_dev
      schema: ayyuborujzade_silver

      libraries:
        - file:
            path: ../lab5_bronze/transformations/bronze_pipeline.py

        - file:
            path: ../lab5_silver/transformations/silver_pipeline.py

      development: false