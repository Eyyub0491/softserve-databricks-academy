resources:
  pipelines:
    lab5_lakeflow:
      name: ayyuborujzade_lab5_lakeflow
      catalog: ${var.source_catalog}
      schema: ${var.silver_schema}
      serverless: true
      configuration:
        source_catalog: ${var.source_catalog}
        bronze_schema: ${var.bronze_schema}
        silver_schema: ${var.silver_schema}
      libraries:
        - glob:
            include: lab5_bronze/transformations/**
        - glob:
            include: lab5_silver/transformations/**

  volumes:
    customer_landing:
      catalog_name: ${var.source_catalog}
      schema_name: ${var.bronze_schema}
      name: customer_landing
      volume_type: MANAGED

    checkpoints:
      catalog_name: ${var.source_catalog}
      schema_name: ${var.bronze_schema}
      name: checkpoints
      volume_type: MANAGED