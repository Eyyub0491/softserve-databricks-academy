bundle:
  name: lab6-gold-layer

include:
  - resources/*.yml

variables:
  catalog:
    description: "Catalog for Lab 6 Gold layer tables"
    default: lab5

  gold_schema:
    description: "Gold schema name"
    default: gold

  warehouse_id:
    description: "SQL Warehouse ID for dashboard"
    default: "7474657415962864"

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: https://dbc-f7231d90-d8a3.cloud.databricks.com

    variables:
      catalog: lab5
      gold_schema: gold
      warehouse_id: "7474657415962864"

  academy:
    mode: development

    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net

    variables:
      catalog: dbr_dev
      gold_schema: ayyuborujzade_gold
      warehouse_id: "7474657415962864"