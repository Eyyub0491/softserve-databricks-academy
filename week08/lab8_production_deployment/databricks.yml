bundle:
  name: softserve-databricks-academy

sync:
  paths:
    - ../../week05/lab5_lakeflow
    - ../../week07/lab7_testing_dq
    - .

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the selected target.
  bronze_schema:
    description: Bronze schema for the selected target.
  silver_schema:
    description: Silver schema for the selected target.
  gold_schema:
    description: Gold schema for the selected target.
  warehouse_id:
    description: SQL Warehouse ID used by the Lab 8 dashboard.

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-f7231d90-d8a3.cloud.databricks.com
    resources:
      dashboards:
        lab8_gold_business_analytics:
          file_path: dashboards/Lab 8 - Gold Layer Business Analytics.lvdash.json
    variables:
      catalog: lab5
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      warehouse_id: "7474657415962864"

  prod:
    mode: production
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
      root_path: /Workspace/Users/ayyub.orujzada@softserve.academy/.bundle/${bundle.name}/${bundle.target}
    resources:
      dashboards:
        lab8_gold_business_analytics:
          file_path: dashboards/Lab 8 - Gold Layer Business Analytics - PROD.lvdash.json
    variables:
      catalog: dbr_dev
      bronze_schema: ayyuborujzade_bronze
      silver_schema: ayyuborujzade_silver
      gold_schema: ayyuborujzade_gold
      warehouse_id: "3ed106620db591d9"