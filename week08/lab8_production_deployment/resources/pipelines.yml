resources:
  pipelines:
    lab5_lakeflow_pipeline:
      name: lab5_lakeflow_pipeline
      catalog: ${var.catalog}
      target: ${var.bronze_schema}
      serverless: true

      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}

      libraries:
        - file:
            path: ../../../week05/lab5_lakeflow/lab5_bronze/transformations/bronze_pipeline.py

    lab5_silver_pipeline:
      name: lab5_silver_pipeline
      catalog: ${var.catalog}
      target: ${var.silver_schema}
      serverless: true

      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}

      libraries:
        - file:
            path: ../../../week05/lab5_lakeflow/lab5_silver/transformations/silver_pipeline.py

    lab7_pipeline:
      name: lab7_pipeline
      catalog: ${var.catalog}
      target: ${var.silver_schema}
      serverless: true

      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}

      libraries:
        - file:
            path: ../../../week07/lab7_testing_dq/lakeflow/lab7_pipeline.py
